name: Diary verification
on:
  pull_request:
  push:
    branches: [feature/android-pressure-diary]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test src/BloodPressureDiary/BloodPressureDiary.UI.Tests/BloodPressureDiary.UI.Tests.csproj --configuration Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install maui-android
      - run: dotnet build src/BloodPressureDiary/BloodPressureDiary.UI/BloodPressureDiary.UI.csproj -f net10.0-android --configuration Debug
